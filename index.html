@media(prefers-reduced-motion:no-preference){.drawer.on .panel{animation:sl .28s ease-out}@keyframes sl{from{opacity:0;transform:translateX(-28px)}}}
#dr .panel>.row{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:4px}
#dr h2{font-family:Amiri,serif;font-size:1.7rem}
.panel input,.panel textarea{border-radius:0;background:#fff}
.ci{display:grid;grid-template-columns:72px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.th{width:72px;height:72px;display:grid;place-items:center}
.th svg{width:60%;color:#5e5e5e}
.cm{display:flex;flex-direction:column;gap:2px}
.cm>b{font-family:Amiri,serif;font-size:1.1rem;line-height:1.4}
.cm small{color:var(--mut)}
.cm .qty{margin-top:6px}
.qty button{border-radius:0;width:30px;height:30px}
.cp{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;align-self:stretch;gap:10px}
.cp b{white-space:nowrap}
.rm{background:none;border:0;color:var(--mut);font-size:.8rem;text-decoration:underline;padding:0}
.empty{text-align:center;padding:56px 10px;color:var(--mut)}
.empty svg{width:56px;height:56px;stroke-width:1.2;color:var(--gold)}
.fs{margin:14px 0 4px;font-size:.9rem}
.fs i{display:block;height:3px;background:var(--line);margin-top:6px}
.fs u{display:block;height:100%;background:var(--gold)}
.fs.ok{color:#7a5a2c;font-weight:600}
.sum{background:#f6f1e8;padding:10px 16px;margin:12px 0}
.sum .row{margin:6px 0}
.sum .tot{border-top:1px solid var(--gold);padding-top:10px;margin-top:10px;font-weight:700;font-size:1.15rem}
.fh{font-size:1.25rem;margin:18px 0 4px}
.cobtn{width:100%;background:#2b1710;color:#ecd9b8;padding:14px;font-size:1rem;letter-spacing:.03em;margin-top:4px}
.ann{background:#f3ece1}
.ann span{color:#5a4333}
.sv{top:auto;bottom:12px;left:auto;right:12px}
.pbox .price:not(.sale){color:var(--ink)}
@media(min-width:900px){.hero{min-height:460px}.hero .bag{bottom:-110px}.hero h1{font-size:4.6rem}}
@media(max-width:360px){.sv{bottom:62px;right:10px}}
h2,h3,.sh h2,.pcard h3,.pbox h2,#dr h2,.mpanel h2,.cm>b,.fh{font-family:Cairo,Tahoma,sans-serif}
.sh h2{font-weight:800;font-size:clamp(2.2rem,8vw,3rem)}
.pcard h3,.cm>b,.pbox h2{font-weight:700;font-size:1.1rem;line-height:1.5}
.pbox h2{font-size:1.5rem}
#dr h2{font-size:1.4rem}
.bd i,.bag small{font-family:Cairo,Tahoma,sans-serif;font-style:normal;font-weight:600;letter-spacing:.16em}
.bag small{font-size:.7rem;color:#6b5a52}
.bl{font-family:Cairo,Tahoma,sans-serif;letter-spacing:.08em}
header{background-attachment:fixed}
.hero{background-attachment:scroll,fixed}
.hero h1{margin-bottom:22px}
</style>
</head>
<body>
<div class="ann" id="an"></div><header><div class="wrap">
<a class="logo" href="#shop" aria-label="قهوة شيكو"><svg id="lg" viewBox="0 0 100 100"></svg><b class="brand" id="sn">قهوة شيكو</b></a>
<div class="nav2"><button class="btn sm" id="mb" aria-label="القائمة"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><button class="btn sm" id="sb" aria-label="بحث"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></button></div><div class="nav"><button class="btn sm" id="cb" aria-label="السلة"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8h13l-1.1 12H6.6L5.5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg><span id="cc">0</span></button></div>
</div></header><div class="sbar" id="sr"><div class="wrap"><input id="sq" placeholder="ابحث عن قهوة…" aria-label="بحث"></div></div>

<main id="shop"><div class="wrap">
<section class="hero">
<div><h1 class="brand">قهوة شيكو</h1><button class="btn" onclick="document.getElementById('pl').scrollIntoView({behavior:'smooth'})">تسوق الآن</button></div>
<div class="bag"><div class="tag">سادة</div><svg id="lg2" viewBox="0 0 100 100"></svg><h3 class="brand">قهوة شيكو</h3><hr><small>TURKISH COFFEE</small></div>
</section>

<div class="sh"><h2 id="pl">الأكثر طلبًا</h2><button class="va" data-f="all">عرض الكل <i>‹</i></button></div>
<div class="filters" id="fl"></div>
<div class="grid" id="pg"></div>
</div></main>

<main class="admin" id="adm"><div class="wrap">
<div id="lgn" class="login"><h2>دخول الأدمن</h2><label>كلمة السر</label><input type="password" id="pw" autocomplete="current-password"><button class="btn" id="li" style="width:100%">دخول</button><p id="le" style="color:#a04a3c"></p></div>
<div id="dsh" style="display:none">
<div class="row"><h2>لوحة التحكم</h2><button class="btn ghost sm" id="lo">تسجيل خروج</button></div>
<div class="stats" id="st"></div>
<div class="tabs"><button class="chip" data-t="p" aria-pressed="true">المنتجات</button><button class="chip" data-t="o" aria-pressed="false">الطلبات</button><button class="chip" data-t="s" aria-pressed="false">الإعدادات</button></div>
<div id="tp"></div><div id="to" style="display:none"></div><div id="ts" style="display:none"></div>
</div></div></main>

<footer><div class="wrap"><span id="ft"></span><br><a href="#admin" style="color:inherit">دخول الأدمن</a></div></footer>

<div class="drawer" id="dr"><div class="panel">
<div class="row"><h2 style="margin:0">سلة المشتريات</h2><button class="btn ghost sm" id="cx">إغلاق</button></div>
<div id="ci"></div>
<div id="ck"></div>
</div></div>
<div class="drawer" id="mn"><div class="panel mpanel"><div class="row" style="margin-bottom:10px"><h2 class="brand" style="margin:0">القائمة</h2><button class="btn ghost sm" id="mx">إغلاق</button></div><button class="mi" data-mf="all">كل المنتجات</button><button class="mi" data-mf="plain">قهوة سادة</button><button class="mi" data-mf="hawaij">قهوة محوج</button><button class="mi" data-mf="light">قهوة فاتح</button><button class="mi" data-mf="box">بوكس هدية</button><a class="mi" href="#admin">لوحة التحكم</a></div></div>
<div class="drawer" id="pm"><div class="pbox" id="pb"></div></div>
<div class="toast" id="tt"></div>

<script>
const $=s=>document.querySelector(s);
const TYPES={all:"الكل",plain:"سادة",hawaij:"محوج",light:"فاتح",box:"بوكس هدية"};
const TN={plain:"سادة",hawaij:"محوج",light:"فاتح",box:"بوكس هدية"};
const EN={plain:"PLAIN",hawaij:"SPICED",light:"LIGHT ROAST",box:"GIFT BOX"};
const DESC={plain:"قهوة تركي سادة من غير إضافات، طعم صافي ورائحة قوية.",hawaij:"قهوة تركي بالحواوج (هيل وتوابل) بنكهة دافية ومميزة.",light:"تحميص فاتح، طعم خفيف وحموضة لطيفة."};
const DEF={settings:{name:"قهوة شيكو",phone:"01000000000",wa:"201000000000",ship:50,free:500,pw:"admin123",footer:"قهوة شيكو – قهوة تركي طازة"},
products:[
{id:1,type:"plain",size:"250 جم",price:120,stock:true},{id:2,type:"plain",size:"500 جم",price:225,stock:true},
{id:3,type:"hawaij",size:"250 جم",price:130,stock:true},{id:4,type:"hawaij",size:"500 جم",price:245,stock:true},
{id:5,type:"light",size:"250 جم",price:125,stock:true},{id:6,type:"light",size:"500 جم",price:235,stock:true},{id:7,type:"box",size:"3 أنواع × 250 جم",price:330,old:375,stock:true}],
orders:[]};
let D,cart={},flt="all",authed=false;
try{D=JSON.parse(localStorage.getItem("chico2")||"null")}catch(e){D=null}
if(!D)D=JSON.parse(JSON.stringify(DEF));
function save(){try{localStorage.setItem("chico2",JSON.stringify(D))}catch(e){}}
function toast(m){const t=$("#tt");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2200)}
const money=n=>n.toLocaleString("en-US")+" ج.م";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pname=p=>p.type==="box"?"بوكس هدية قهوة شيكو":"قهوة تركي "+TN[p.type];
const LOGO='<g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M22 30 L50 8 L78 30 Z"/><rect x="30" y="30" width="40" height="22"/><rect x="45" y="16" width="10" height="9"/><rect x="26" y="52" width="48" height="20" rx="2"/><circle cx="34" cy="80" r="8"/><circle cx="66" cy="80" r="8"/><circle cx="34" cy="80" r="2.5"/><circle cx="66" cy="80" r="2.5"/><path d="M36 38h10v10H36zM52 40h10v8H52z"/></g><ellipse cx="50" cy="62" rx="5" ry="7" fill="#a9806c" transform="rotate(25 50 62)"/>';
const BAG='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8h13l-1.1 12H6.6L5.5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>';
$("#lg").innerHTML=LOGO;$("#lg2").innerHTML=LOGO;

function renderFilters(){$("#fl").innerHTML=Object.entries(TYPES).map(([k,v])=>`<button class="chip" data-f="${k}" aria-pressed="${k===flt}">${v}</button>`).join("")}
function renderProducts(){
 const l=Object.values(D.products.filter(p=>(flt==="all"||p.type===flt)&&(!qs||(pname(p)+" "+p.size).includes(qs))).reduce((a,p)=>{(a[p.type]=a[p.type]||[]).push(p);return a},{})).map(g=>{g.sort((x,y)=>(y.stock-x.stock)||(x.price-y.price));return g[0]});
 $("#pg").innerHTML=l.length?l.map(p=>{const sale=p.old>p.price;return `<div class="pcard ${p.stock?"":"out"}" data-open="${p.type}" tabindex="0" role="button"><div class="img t-${p.type}"><span class="bd b-${p.type}">${TN[p.type]}<i>${EN[p.type]}</i></span>${sale?`<span class="sv">وفّر ${money(p.old-p.price)}</span>`:""}<svg viewBox="0 0 100 100">${LOGO}</svg>${p.stock?`<button class="cartb" tabindex="-1" aria-label="اختار الحجم واشتري">${BAG}</button>`:""}</div><small class="bl">${esc(D.settings.name)}</small><h3>${pname(p)}</h3><div class="pp"><span class="price ${sale?"sale":""}">${D.products.filter(x=>x.type===p.type&&x.stock).length>1?"من ":""}${money(p.price)}</span>${sale?`<s>${money(p.old)}</s>`:""}${p.stock?"":"<span>غير متوفر</span>"}</div></div>`}).join(""):"<p>مفيش منتجات في القسم ده دلوقتي.</p>";
}
function renderBrand(){const s=D.settings;const it=[`شحن مجاني على الطلبات فوق ${s.free} ج.م`,"تحميص طازة","توصيل لكل المحافظات","الدفع عند الاستلام"].map(t=>`<span>${t} ✦</span>`).join("");$("#an").innerHTML=`<div class="mt">${it.repeat(8)}</div>`;$("#sn").textContent=s.name;document.title=s.name;$("#ft").textContent=s.footer+" | "+s.phone}
function cartLines(){return Object.entries(cart).map(([id,q])=>({p:D.products.find(x=>x.id==id),q})).filter(x=>x.p)}
function renderCart(){
 const L=cartLines(),n=L.reduce((a,x)=>a+x.q,0),sub=L.reduce((a,x)=>a+x.q*x.p.price,0),sh=sub>=+D.settings.free?0:+D.settings.ship;
 $("#cc").textContent=n;const v=["cn","cp","ca"].map(i=>$("#"+i)?$("#"+i).value:"");
 $("#ci").innerHTML=L.length?L.map(x=>`<div class="ci"><div class="th t-${x.p.type}"><svg viewBox="0 0 100 100">${LOGO}</svg></div><div class="cm"><b>${pname(x.p)}</b><small>${esc(x.p.size)}</small><div class="qty"><button data-q="${x.p.id}" data-d="-1" aria-label="نقص">−</button><b>${x.q}</b><button data-q="${x.p.id}" data-d="1" aria-label="زود">+</button></div></div><div class="cp"><b>${money(x.p.price*x.q)}</b><button class="rm" data-q="${x.p.id}" data-d="-99">إزالة</button></div></div>`).join(""):`<div class="empty">${BAG}<p>السلة فاضية</p><button class="btn" data-mf="all" onclick="$('#dr').classList.remove('on')">تصفح المنتجات</button></div>`;
 $("#ck").innerHTML=L.length?`${sub<+D.settings.free?`<div class="fs"><span>باقي ${money(+D.settings.free-sub)} للشحن المجاني</span><i><u style="width:${Math.round(sub/+D.settings.free*100)}%"></u></i></div>`:`<div class="fs ok"><span>الشحن مجاني على طلبك ✦</span></div>`}<div class="sum"><p class="row"><span>المجموع</span><b>${money(sub)}</b></p><p class="row"><span>الشحن</span><b>${sh?money(sh):"مجاني"}</b></p><p class="row tot"><span>الإجمالي</span><b>${money(sub+sh)}</b></p></div><h3 class="fh">بيانات التوصيل</h3><label>الاسم</label><input id="cn"><label>رقم الموبايل</label><input id="cp" inputmode="tel"><label>العنوان</label><textarea id="ca" rows="2"></textarea><button class="btn cobtn" id="co">تأكيد الطلب · ${money(sub+sh)}</button>`:"";if(L.length)["cn","cp","ca"].forEach((id,i)=>{$("#"+id).value=v[i]||""});
}
let qs="";let pv={t:null,id:null,q:1};
function openP(t){const L=D.products.filter(p=>p.type===t&&p.stock).sort((a,b)=>a.price-b.price);if(!L.length){document.getElementById("pl").scrollIntoView({behavior:"smooth"});return}pv={t,id:L[0].id,q:1};renderPM();$("#pm").classList.add("on")}
function renderPM(){
 const L=D.products.filter(p=>p.type===pv.t&&p.stock).sort((a,b)=>a.price-b.price),p=L.find(x=>x.id==pv.id)||L[0],sale=p.old>p.price;
 $("#pb").innerHTML=`<button class="btn ghost sm pclose" id="pcx" aria-label="إغلاق">✕</button><div class="img t-${p.type}"><span class="bd b-${p.type}">${TN[p.type]}<i>${EN[p.type]}</i></span><svg viewBox="0 0 100 100">${LOGO}</svg></div><h2 class="brand" style="margin:12px 0 0">${pname(p)}</h2><p style="color:var(--mut);margin:4px 0 10px">${DESC[p.type]||"بوكس هدية بتشكيلة من أنواع قهوة شيكو."}</p><label>اختار الحجم</label><div class="sizes">${L.map(x=>`<button class="chip" data-sz="${x.id}" aria-pressed="${x.id==p.id}">${esc(x.size)}<br><b>${money(x.price)}</b></button>`).join("")}</div><div class="pp" style="margin:12px 0"><span class="price ${sale?"sale":""}" style="font-size:1.5rem">${money(p.price*pv.q)}</span>${sale?`<s>${money(p.old*pv.q)}</s>`:""}</div><div class="qty"><button data-pq="-1" aria-label="نقص">−</button><b>${pv.q}</b><button data-pq="1" aria-label="زود">+</button></div><div class="row" style="margin-top:14px;gap:10px"><button class="btn ghost" style="flex:1" data-pa="add">أضف للسلة</button><button class="btn" style="flex:1" data-pa="buy">اشتري الآن</button></div>`;
 pv.id=p.id;
}
function checkout(){
 const n=$("#cn").value.trim(),p=$("#cp").value.trim(),a=$("#ca").value.trim();
 if(!n||!p||!a){toast("اكتب الاسم والموبايل والعنوان");return}
 const L=cartLines(),sub=L.reduce((s,x)=>s+x.q*x.p.price,0),total=sub+(sub>=+D.settings.free?0:+D.settings.ship);
 const items=L.map(x=>`${pname(x.p)} ${x.p.size} × ${x.q}`);
 const o={id:Date.now(),name:n,phone:p,addr:a,items,total,status:"جديد",date:new Date().toLocaleString("ar-EG")};
 D.orders.unshift(o);save();cart={};renderCart();renderAdmin();
 $("#dr").classList.remove("on");toast("تم استلام طلبك، هنكلمك للتأكيد");
 const msg=`طلب جديد من ${n}\n${items.join("\n")}\nالإجمالي: ${total} ج.م\n${p}\n${a}`;
 if(D.settings.wa)window.open("https://wa.me/"+D.settings.wa+"?text="+encodeURIComponent(msg),"_blank");
}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.mf){flt=t.dataset.mf;renderFilters();renderProducts();$("#mn").classList.remove("on");document.getElementById("pl").scrollIntoView({behavior:"smooth"})}else if(t.id==="mb")$("#mn").classList.add("on");else if(t.id==="mx")$("#mn").classList.remove("on");else if(t.id==="sb"){const s=$("#sr");s.classList.toggle("on");if(s.classList.contains("on"))$("#sq").focus()}else if(t.dataset.sz){pv.id=+t.dataset.sz;renderPM()}else if(t.dataset.pq){pv.q=Math.max(1,Math.min(20,pv.q+ +t.dataset.pq));renderPM()}else if(t.dataset.pa){cart[pv.id]=(cart[pv.id]||0)+pv.q;renderCart();$("#pm").classList.remove("on");if(t.dataset.pa==="buy")$("#dr").classList.add("on");else toast("اتضاف للسلة")}else if(t.id==="pcx")$("#pm").classList.remove("on");else if(t.dataset.f){flt=t.dataset.f;renderFilters();renderProducts()}
 else if(t.dataset.add){cart[t.dataset.add]=(cart[t.dataset.add]||0)+1;renderCart();toast("اتضاف للسلة")}
 else if(t.dataset.q){const id=t.dataset.q;cart[id]=(cart[id]||0)+ +t.dataset.d;if(cart[id]<=0)delete cart[id];renderCart()}
 else if(t.id==="cb")$("#dr").classList.add("on");
 else if(t.id==="cx")$("#dr").classList.remove("on");
 else if(t.id==="co")checkout();
 else if(t.id==="th"){const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"}
 else if(t.dataset.t)tab(t.dataset.t);
 else if(t.id==="li"){if($("#pw").value===D.settings.pw){authed=true;route()}else $("#le").textContent="كلمة السر غلط"}
 else if(t.id==="lo"){authed=false;route()}
 else if(t.dataset.ed)editP(+t.dataset.ed);
 else if(t.dataset.del){if(confirm("تمسح المنتج ده؟")){D.products=D.products.filter(p=>p.id!=t.dataset.del);save();renderAdmin();renderProducts()}}
 else if(t.dataset.tg){const p=D.products.find(x=>x.id==t.dataset.tg);p.stock=!p.stock;save();renderAdmin();renderProducts()}
 else if(t.dataset.od){D.orders=D.orders.filter(o=>o.id!=t.dataset.od);save();renderAdmin()}
 else if(t.id==="sp")saveP();
 else if(t.id==="ss")saveS();
 else if(t.id==="cl"){if(confirm("تمسح كل الطلبات؟")){D.orders=[];save();renderAdmin()}}
});
document.addEventListener("change",e=>{if(e.target.dataset.os){const o=D.orders.find(x=>x.id==e.target.dataset.os);o.status=e.target.value;save();renderAdmin()}});
function tab(k){document.querySelectorAll("[data-t]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===k));$("#tp").style.display=k==="p"?"":"none";$("#to").style.display=k==="o"?"":"none";$("#ts").style.display=k==="s"?"":"none"}
let editId=null;
function editP(id){editId=id;const p=D.products.find(x=>x.id==id);$("#pt").value=p.type;$("#pz").value=p.size;$("#pr").value=p.price;$("#po").value=p.old||"";$("#sp").textContent="حفظ التعديل";$("#pt").scrollIntoView({behavior:"smooth",block:"center"})}
function saveP(){
 const type=$("#pt").value,size=$("#pz").value.trim(),price=+$("#pr").value,old=+$("#po").value||0;
 if(!size||!(price>0)){toast("اكتب الحجم وسعر صحيح");return}
 if(editId){Object.assign(D.products.find(x=>x.id==editId),{type,size,price,old})}
 else D.products.push({id:Date.now(),type,size,price,old,stock:true});
 editId=null;$("#pz").value="";$("#pr").value="";$("#po").value="";$("#sp").textContent="إضافة منتج";save();renderAdmin();renderProducts();toast("تم الحفظ");
}
function saveS(){
 const s=D.settings;s.name=$("#s1").value.trim()||s.name;s.phone=$("#s2").value.trim();s.wa=$("#s3").value.trim();s.ship=+$("#s4").value||0;s.free=+$("#s7").value||0;s.footer=$("#s5").value.trim();
 const pw=$("#s6").value.trim();if(pw)s.pw=pw;
 save();renderBrand();renderProducts();renderCart();toast("تم حفظ الإعدادات");
}
function renderAdmin(){
 const rev=D.orders.filter(o=>o.status!=="ملغي").reduce((a,o)=>a+o.total,0);
 $("#st").innerHTML=`<div class="stat">المنتجات<b>${D.products.length}</b></div><div class="stat">الطلبات<b>${D.orders.length}</b></div><div class="stat">طلبات جديدة<b>${D.orders.filter(o=>o.status==="جديد").length}</b></div><div class="stat">المبيعات<b>${money(rev)}</b></div>`;

function route(){
 const a=location.hash==="#admin";
 $("#shop").style.display=a?"none":"";$("#adm").style.display=a?"block":"none";
 $("#lgn").style.display=authed?"none":"";$("#dsh").style.display=authed?"":"none";

 window.scrollTo(0,0);

document.addEventListener("click",e=>{const c=e.target.closest("[data-open]");if(c)openP(c.dataset.open)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.open)openP(e.target.dataset.open);if(e.key==="Escape")$("#pm").classList.remove("on")});
$("#pm").addEventListener("click",e=>{if(e.target.id==="pm")$("#pm").classList.remove("on")});
$("#mn").addEventListener("click",e=>{if(e.target.id==="mn"||e.target.closest("a"))$("#mn").classList.remove("on")});
$("#sq").addEventListener("input",e=>{qs=e.target.value.trim();renderProducts()});
addEventListener("hashchange",route);
renderBrand();renderFilters();renderProducts();renderCart();renderAdmin();route();
